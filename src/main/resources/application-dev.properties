# Local development schema generation
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upload_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
# When false, run Flyway migrations manually if you hit uploads_status_check (valores canônicos: RECEBIDO, EM_PROCESSAMENTO, ANALISADO, ERRO).

# AWS — leave CLOUD_AWS_ENDPOINT_S3 empty to use the real regional S3 API (s3.<region>.amazonaws.com).
# Do NOT set this to the AWS Console URL (console.aws.amazon.com/...); the SDK will get HTTP 405 on PutObject.
# LocalStack: CLOUD_AWS_ENDPOINT_S3=http://localhost:4566 (or http://localstack:4566 from another container)
cloud.aws.region=${CLOUD_AWS_REGION:us-east-2}
cloud.aws.endpoint.s3=${CLOUD_AWS_ENDPOINT_S3:}
cloud.aws.endpoint.sqs=${CLOUD_AWS_ENDPOINT_SQS:https://sqs.us-east-2.amazonaws.com}
cloud.aws.accessKey=${AWS_ACCESS_KEY_ID:}
cloud.aws.secretKey=${AWS_SECRET_ACCESS_KEY:}

# Application infrastructure (bucket and queues created by docker-compose setup; SQS requires full queue URLs)
application.s3.bucket=${APPLICATION_S3_BUCKET:upload-service-bucket-ai-analyzer}
application.sqs.queueUrl=${APPLICATION_SQS_QUEUE_URL:https://sqs.us-east-2.amazonaws.com/731962933226/upload-queue}

# SQS result listener - consume analysis results from processing service
app.sqs.result-listener.enabled=${APP_SQS_RESULT_LISTENER_ENABLED:true}
app.sqs.result-listener.queue-url=${APP_SQS_RESULT_LISTENER_QUEUE_URL:https://sqs.us-east-2.amazonaws.com/731962933226/status-update-queue}
app.sqs.result-listener.poll-interval-seconds=${APP_SQS_RESULT_LISTENER_POLL_INTERVAL_SECONDS:5}
app.sqs.result-listener.max-messages=${APP_SQS_RESULT_LISTENER_MAX_MESSAGES:10}
app.sqs.result-listener.wait-time-seconds=${APP_SQS_RESULT_LISTENER_WAIT_TIME_SECONDS:5}

# Logging for debugging
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.org.springframework.web.servlet.handler.AbstractHandlerExceptionResolver=DEBUG
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.com.fiap.hackathon.upload_service=DEBUG
logging.level.com.fiap.hackathon.upload_service.infra.aws.AnalysisResultSqsListener=DEBUG
logging.level.com.fiap.hackathon.upload_service.service.AnalysisCallbackService=DEBUG
