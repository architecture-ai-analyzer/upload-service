spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties],optional:file:.env.dev[.properties]

# Local development schema generation
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# LocalStack/AWS
cloud.aws.region=${CLOUD_AWS_REGION:us-east-2}
cloud.aws.endpoint.s3=${CLOUD_AWS_ENDPOINT_S3:https://localhost.localstack.cloud:4566}
cloud.aws.endpoint.sqs=${CLOUD_AWS_ENDPOINT_SQS:https://localhost.localstack.cloud:4566}
cloud.aws.accessKey=${CLOUD_AWS_ACCESS_KEY:test}
cloud.aws.secretKey=${CLOUD_AWS_SECRET_KEY:test}

# Application infrastructure
application.s3.bucket=${APPLICATION_S3_BUCKET:upload}
application.sqs.queueUrl=${APPLICATION_SQS_QUEUE_URL:https://localhost.localstack.cloud:4566/000000000000/upload-queue}
application.sqs.dlqUrl=${APPLICATION_SQS_DLQ_URL:https://localhost.localstack.cloud:4566/000000000000/upload-dlq}
application.sqs.maxRetries=${APPLICATION_SQS_MAX_RETRIES:5}
