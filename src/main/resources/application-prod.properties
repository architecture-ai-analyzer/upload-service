spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# AWS
cloud.aws.region=${CLOUD_AWS_REGION:us-east-2}
cloud.aws.endpoint.s3=${CLOUD_AWS_ENDPOINT_S3:}
cloud.aws.endpoint.sqs=${CLOUD_AWS_ENDPOINT_SQS:}
cloud.aws.accessKey=${CLOUD_AWS_ACCESS_KEY:}
cloud.aws.secretKey=${CLOUD_AWS_SECRET_KEY:}

# Application infrastructure
application.s3.bucket=${APPLICATION_S3_BUCKET:}
application.sqs.queueUrl=${APPLICATION_SQS_QUEUE_URL:}

# SQS result listener - analysis results from processing service
app.sqs.result-listener.enabled=${APP_SQS_RESULT_LISTENER_ENABLED:false}
app.sqs.result-listener.queue-url=${APP_SQS_RESULT_LISTENER_QUEUE_URL:}
app.sqs.result-listener.poll-interval-seconds=${APP_SQS_RESULT_LISTENER_POLL_INTERVAL_SECONDS:10}
app.sqs.result-listener.max-messages=${APP_SQS_RESULT_LISTENER_MAX_MESSAGES:10}
app.sqs.result-listener.wait-time-seconds=${APP_SQS_RESULT_LISTENER_WAIT_TIME_SECONDS:20}

# Security: API Gateway + Lambda authorizer is the primary auth control in non-dev environments
app.security.gateway-trust.enabled=${APP_SECURITY_GATEWAY_TRUST_ENABLED:true}
app.security.gateway-trust.shared-secret=${APP_SECURITY_GATEWAY_TRUST_SHARED_SECRET:}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:}
app.security.rate-limit.upload.enabled=${APP_SECURITY_RATE_LIMIT_UPLOAD_ENABLED:true}
