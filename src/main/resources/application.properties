spring.application.name=${SPRING_APPLICATION_NAME:upload-service}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info,env,loggers
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Prometheus metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Info endpoint
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Upload Service for Hackathon POS
info.app.version=0.0.1-SNAPSHOT

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# API Gateway trust (default off, enabled in homolog/prod)
app.security.gateway-trust.enabled=${APP_SECURITY_GATEWAY_TRUST_ENABLED:false}
app.security.gateway-trust.user-header=${APP_SECURITY_GATEWAY_TRUST_USER_HEADER:X-Authenticated-User}
app.security.gateway-trust.scopes-header=${APP_SECURITY_GATEWAY_TRUST_SCOPES_HEADER:X-Authenticated-Scopes}
app.security.gateway-trust.signature-header=${APP_SECURITY_GATEWAY_TRUST_SIGNATURE_HEADER:X-Gateway-Signature}
app.security.gateway-trust.timestamp-header=${APP_SECURITY_GATEWAY_TRUST_TIMESTAMP_HEADER:X-Gateway-Timestamp}
app.security.gateway-trust.shared-secret=${APP_SECURITY_GATEWAY_TRUST_SHARED_SECRET:}
app.security.gateway-trust.max-skew-seconds=${APP_SECURITY_GATEWAY_TRUST_MAX_SKEW_SECONDS:300}

# CORS configuration
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://*.cloudfront.net}
app.security.cors.allowed-methods=${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${APP_SECURITY_CORS_ALLOWED_HEADERS:*}
app.security.cors.allow-credentials=${APP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.security.cors.max-age=${APP_SECURITY_CORS_MAX_AGE:3600}

# Upload rate limiting (default off, enabled by environment)
app.security.rate-limit.upload.enabled=${APP_SECURITY_RATE_LIMIT_UPLOAD_ENABLED:false}
app.security.rate-limit.upload.max-requests=${APP_SECURITY_RATE_LIMIT_UPLOAD_MAX_REQUESTS:30}
app.security.rate-limit.upload.window-seconds=${APP_SECURITY_RATE_LIMIT_UPLOAD_WINDOW_SECONDS:60}

# AWS SDK resilience defaults
cloud.aws.client.api-call-timeout-seconds=${CLOUD_AWS_CLIENT_API_CALL_TIMEOUT_SECONDS:30}
cloud.aws.client.api-call-attempt-timeout-seconds=${CLOUD_AWS_CLIENT_API_CALL_ATTEMPT_TIMEOUT_SECONDS:10}
cloud.aws.client.max-retries=${CLOUD_AWS_CLIENT_MAX_RETRIES:3}

# S3 encryption at rest
application.s3.server-side-encryption.enabled=${APPLICATION_S3_SSE_ENABLED:true}
application.s3.server-side-encryption.algorithm=${APPLICATION_S3_SSE_ALGORITHM:AES256}

# SQS event publisher - retry + DLQ settings
app.sqs.publisher.max-retries=${APP_SQS_PUBLISHER_MAX_RETRIES:3}
app.sqs.publisher.initial-backoff-ms=${APP_SQS_PUBLISHER_INITIAL_BACKOFF_MS:200}

# SQS result listener - consume analysis results from processing service
app.sqs.result-listener.enabled=${APP_SQS_RESULT_LISTENER_ENABLED:false}
app.sqs.result-listener.queue-url=${APP_SQS_RESULT_LISTENER_QUEUE_URL:}
app.sqs.result-listener.poll-interval-seconds=${APP_SQS_RESULT_LISTENER_POLL_INTERVAL_SECONDS:10}
app.sqs.result-listener.max-messages=${APP_SQS_RESULT_LISTENER_MAX_MESSAGES:10}
app.sqs.result-listener.wait-time-seconds=${APP_SQS_RESULT_LISTENER_WAIT_TIME_SECONDS:20}

# Datadog Tracing
dd.trace.enabled=true
dd.service=upload-service
dd.trace.http.client.tag.query-string=true
dd.trace.jdbc.enabled=true
dd.trace.jdbc.query-size=5000
dd.trace.logs.injection=true
dd.trace.sample.rate=1.0
dd.env=${DD_ENV:dev}
dd.version=${DD_VERSION:0.0.1-SNAPSHOT}
dd.trace.agent.host=${DD_AGENT_HOST:localhost}
dd.trace.agent.port=${DD_AGENT_PORT:8126}
dd.trace.debug=false
datadog.statsd.host=${DATADOG_STATSD_HOST:localhost}
datadog.statsd.port=${DATADOG_STATSD_PORT:8125}
