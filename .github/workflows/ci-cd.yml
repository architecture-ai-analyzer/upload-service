name: CI/CD - Upload Service Build & ECS Deploy

on:
  push:
    branches:
      - pipeline
      - main
      - homologation
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'dev' || (github.ref_name == 'homologation' && 'homologation' || 'dev') }}
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/upload-service

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'dev' || (github.ref_name == 'homologation' && 'homologation' || 'develop') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Unit Tests
        run: mvn -B test

  build-and-test:
    name: Build Project
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'dev' || (github.ref_name == 'homologation' && 'homologation' || 'develop') }}
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn -B clean package

  quality-check:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'dev' || (github.ref_name == 'homologation' && 'homologation' || 'develop') }}
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WO }}
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.login=$SONAR_TOKEN -Dsonar.projectKey=challenger-pos_work-order-service -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        continue-on-error: true

      - name: Comment PR with SonarQube results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Code Quality Report\n\n✅ SonarQube analysis completed!\n\n[View detailed report](https://sonarcloud.io/dashboard?id=challenger-pos_work-order-service)`
            });
        continue-on-error: true

  push-and-deploy:
    name: Push Image & Deploy Infra
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'dev' || (github.ref_name == 'homologation' && 'homologation' || 'develop') }}
    needs: [build-and-test, quality-check]

    env:
      TERRAFORM_DIR: infra/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment tag
        id: envtag
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "TAG=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t $DOCKER_IMAGE:${{ env.TAG }} .
          docker push $DOCKER_IMAGE:${{ env.TAG }}
          docker tag $DOCKER_IMAGE:${{ env.TAG }} $DOCKER_IMAGE:latest
          docker push $DOCKER_IMAGE:latest

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -backend-config="key=v4/upload-service/${{ env.ENVIRONMENT }}/terraform.tfstate"

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_aws_access_key: ${{ secrets.SQS_AWS_ACCESS_KEY }}
          TF_VAR_aws_secret_key: ${{ secrets.SQS_AWS_SECRET_KEY }}
          TF_VAR_app_image: ${{ env.DOCKER_IMAGE }}:${{ env.TAG }}

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_aws_access_key: ${{ secrets.SQS_AWS_ACCESS_KEY }}
          TF_VAR_aws_secret_key: ${{ secrets.SQS_AWS_SECRET_KEY }}
          TF_VAR_app_image: ${{ env.DOCKER_IMAGE }}:${{ env.TAG }}
