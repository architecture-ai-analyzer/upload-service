name: Upload Service CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || 'upload-service' }}
  ECS_CLUSTER_PREFIX: ${{ vars.ECS_CLUSTER_PREFIX || 'upload-service' }}
  ECS_SERVICE_PREFIX: ${{ vars.ECS_SERVICE_PREFIX || 'upload-service' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'upload-service-service' }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'upload-service' }}

concurrency:
  group: upload-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve deployment context
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.context.outputs.deploy_env }}
      ecs_cluster: ${{ steps.context.outputs.ecs_cluster }}
      ecs_service: ${{ steps.context.outputs.ecs_service }}

    steps:
      - name: Resolve environment from branch
        id: context
        env:
          RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          ECS_CLUSTER_PREFIX: ${{ env.ECS_CLUSTER_PREFIX }}
          ECS_SERVICE_PREFIX: ${{ env.ECS_SERVICE_PREFIX }}
        run: |
          DEPLOY_ENV=$(printf '%s' "$RAW_BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=${ECS_CLUSTER_PREFIX}-${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "ecs_service=${ECS_SERVICE_PREFIX}-${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Unit Tests
        run: mvn -B test

  build-and-test:
    name: Build Project
    runs-on: ubuntu-latest
    needs:
      - prepare
      - unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Project
        run: mvn -B clean package

  quality-check:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.login=$SONAR_TOKEN -Dsonar.projectKey=challenger-pos_upload-service -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        continue-on-error: true

      - name: Comment PR with SonarQube results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Code Quality Report\n\n✅ SonarQube analysis completed!\n\n[View detailed report](https://sonarcloud.io/dashboard?id=challenger-pos_upload-service)`
            });
        continue-on-error: true

  docker-smoke-build:
    name: Docker smoke build
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-test
      - quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t upload-service:${{ github.sha }} .

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-test
      - quality-check
      - docker-smoke-build
    if: github.event_name != 'pull_request'
    environment: ${{ needs.prepare.outputs.deploy_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_URI="docker.io/$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE_NAME:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-account.outputs.account_id }}
          DEPLOY_ENV: ${{ needs.prepare.outputs.deploy_env }}
          DOCKER_IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: scripts/render-task-definition.sh ecs/task-definition.json ecs/task-definition.rendered.json

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ecs/task-definition.rendered.json
          service: ${{ needs.prepare.outputs.ecs_service }}
          cluster: ${{ needs.prepare.outputs.ecs_cluster }}
          wait-for-service-stability: true
