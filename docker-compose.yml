services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=upload_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d upload_service"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:1.4.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-2
      - PERSISTENCE=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - localstack_data:/var/lib/localstack

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - envs/.env.local
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: on-failure

  # S3 bucket and SQS queue names match defaults in application-dev.properties (profile dev).
  setup:
    image: localstack/localstack:1.4.0
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh","-c"]
    command: >
      "sleep 5;
       aws --endpoint-url=http://localstack:4566 s3 mb s3://upload || true;
       aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name upload-queue || true;
       aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name analysis-result-queue || true;
       echo 'resources created';"
    environment:
      - SERVICES=s3,sqs
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-2
    restart: 'no'

volumes:
  localstack_data:
  postgres_data:
